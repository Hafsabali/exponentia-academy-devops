{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Exponentia Academy</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Exponentia Academy</h1>

        <h2>Student Login</h2>

        <p>Access your courses, admission details and learning resources.</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="/signup/">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
